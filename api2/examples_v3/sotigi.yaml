---
- text: hatali, te hox danse denwatu hu mi sotigi gitara,
  cite:
    text:
      eng: 'Doxo: Poema fal Sarin Ci'
    link:
      eng: https://doxo.globasa.net/eng/poema/poema-fal-sarin-ci
  translations:
  - text: hatali
    eng: 'hatali (t) adv: even so, still, however, nevertheless, nonetheless, in spite
      of that, yet'
    spa: 'hatali (t) adv: aun as&iacute;, sin embargo, no obstante, a pesar de eso'
  - text: ', '
  - text: te
    eng: 'te (pn) pron (animate): he, him, she, her, they (singular), them (singular),
      it'
    spa: 'te (pn) pron (animado): &eacute;l, ella, ello, lo, la, le'
  - text: ' '
  - text: hox
    eng: 'hox (t) adj: happy, joyful; adv: happily, joyfully'
    spa: 'hox (t) adj: feliz, contento, alegre; adv: felizmente, alegremente'
  - text: ' '
  - text: danse
    eng: 'danse (b.oj.ru) n: dance; v.tr: dance'
    spa: 'danse (b.oj.ru) s: baile, danza; v.tr: bailar, danzar'
  - text: ' '
  - text: denwatu
    eng: 'denwatu (tabel: m) adv: then (at that time/moment)'
    spa: 'denwatu (tabel: m) adv: entonces, en ese momento, en aquel momento'
  - text: ' '
  - text: hu
    eng: 'hu (l) conj (relative clause marker): who, which, that'
    spa: 'hu (l) conj (marcador de oraci&oacute;n de relativo): que, quien, el cual'
  - text: ' '
  - text: mi
    eng: 'mi (pn) pron: I, me'
    spa: 'mi (pn) pron: yo, me, m&iacute;'
  - text: ' '
  - text: sotigi
    eng: 'sotigi (b.oj) v.tr: (cause to make a) sound, play (instrument)'
    spa: 'sotigi (b.oj) v.tr: hacer sonar, tocar (un instrumento)'
  - text: ' '
  - text: gitara
    eng: 'gitara (b) n: guitar'
    spa: 'gitara (b) s: guitarra'
  - text: ','
