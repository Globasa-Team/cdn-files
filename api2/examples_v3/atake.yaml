- text: Te fikir dur lungo watu ku maxim bon harka sen keto ji, dur na xorjui ki te
    hare xosu watu in sesu watumeter, te karar na atake waziri de Rita, mas, hinte
    bujo waziri de Martin dur na gibe xahu tas tesu manwangu.
