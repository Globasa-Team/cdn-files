---
- text: Jasusiyen Kantaka, hu da labas syahe labas, hu da koberi sesu total jismu,
    minus sesu oko, har beltu har ban tul, fale espesyal misyon temki te musi na rucudu
    Kijawi Cinju, hu da sen bax kowa de hataripul krimentim, hu da belide hataripul
    lideyen Gubangu, hu da vole na krasi globali ekonomi.
