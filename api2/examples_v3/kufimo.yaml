- text: "Hufax ganjon simpati tas kiwi ji te loga, \u201CMi ger suki na fale dento,
    mas, mi no sen kufimo bala cel na tonporta yu; fe hataya, mi jixi ki ukabu sen
    bala ji te abil na sahay yu, mas, te ogar teli, tras bahari.\u201D"
  cite:
    text:
      eng: 'Doxo: Hikaye fal Sarin Ci'
    link:
      eng: https://doxo.globasa.net/eng/lilhikaye/hikaye-fal-sarin-ci
