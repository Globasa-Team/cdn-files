- text: 'Hijerayen of Eyre ji Eskoti le preporta multi to of hin cwenton cel Utara-Amerika,
    ji denloka Halowin le darajeli evolu cel dento hu imi kone da nundin: jaxne fe
    kostum, daykabaca ji cwenton fe na idi of baytu cel baytu cel na taslum kendi.'
